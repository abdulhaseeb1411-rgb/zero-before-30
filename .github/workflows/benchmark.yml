name: Z30 Benchmark

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Run transaction benchmark
        run: npm run benchmark
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-benchmark-result
          path: benchmark-result.json
