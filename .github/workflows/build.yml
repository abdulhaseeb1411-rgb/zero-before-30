name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Run transaction benchmark
        run: npm run benchmark

      - name: Upload transaction benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-benchmark-report
          path: benchmark-result.json
          if-no-files-found: ignore
